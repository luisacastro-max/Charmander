<style>

:root[data-theme=dark]{--bg:#0C1824;--cd:#142536;--tx:#EAF1F8;--mu:#B3C1CF;--pr:#6BB8EA;--on:#06121D;--ok:#4FD6A0;--wa:#F5B461;--bd:#2B4157;--sf:#1A3047}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.45;position:relative}
.app.big{font-size:20px}
.app.hc{--bg:#000;--cd:#000;--tx:#fff;--mu:#fff;--pr:#FFE600;--on:#000;--ok:#00FFB3;--wa:#FFB000;--bd:#fff;--sf:#111}

.app.calm *,.app.calm *::before{animation:none!important;transition:none!important}

main{flex:1;overflow:auto;padding:16px 16px 24px}
main:focus{outline:none}
h1{font-size:1.6em;margin:.2em 0 .3em;line-height:1.15}h2{font-size:1.15em;margin:1em 0 .4em}p{margin:.3em 0}
.mu{color:var(--mu)}.sm{font-size:.88em}
.cd{background:var(--cd);border:1.5px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.b{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:10px 16px;border-radius:14px;border:2px solid var(--pr);background:var(--pr);color:var(--on);font-weight:700}
.b.s{background:transparent;color:var(--pr)}.b.w{background:var(--wa);border-color:var(--wa);color:var(--on)}
.b.sm{min-height:44px;width:auto;padding:6px 14px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:92px;padding:12px;border-radius:16px;border:1.5px solid var(--bd);background:var(--cd);text-align:left;font-weight:700}
.sc span.i{font-size:1.6em}
.tg{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;background:var(--cd);border:1.5px solid var(--bd);border-radius:14px;margin:6px 0;min-height:56px}
.tg[aria-pressed=true],.sc[aria-pressed=true]{border-color:var(--pr);background:var(--sf)}
.sw{margin-left:auto;font-weight:700;color:var(--pr);white-space:nowrap}
.ch{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--bd);background:var(--cd);margin:3px 4px 3px 0}
.ch[aria-pressed=true]{background:var(--pr);color:var(--on);border-color:var(--pr)}
input,textarea,select{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--cd)}
label{font-weight:700;display:block;margin:10px 0 4px}
nav{display:flex;border-top:1.5px solid var(--bd);background:var(--cd)}
nav button{flex:1;min-height:60px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:.78em;font-weight:700;color:var(--mu)}
nav button[aria-current=page]{color:var(--pr);box-shadow:inset 0 3px 0 var(--pr)}
nav .i{font-size:1.5em}
.top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bk{min-height:44px;min-width:44px;border-radius:12px;border:1.5px solid var(--bd);background:var(--cd)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;border:1.5px solid var(--bd);font-size:.82em;margin:2px 4px 2px 0}
.bar{height:12px;border-radius:9px;background:var(--sf);border:1.5px solid var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.big-msg{font-size:1.7em;font-weight:700;text-align:center;padding:18px;border:3px solid var(--pr);border-radius:18px;background:var(--cd)}
.ms{max-width:86%;padding:10px 12px;border-radius:14px;margin:6px 0;border:1.5px solid var(--bd);background:var(--cd)}
.ms.v{margin-left:auto;background:var(--sf)}.ms b{display:block;font-size:.8em}
.fs{position:absolute;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:20px;gap:16px}
.fs .big-msg{font-size:2.3em}
.note{padding:10px 12px;border-radius:12px;border:1.5px dashed var(--wa);margin:8px 0;font-size:.9em}
.step{display:flex;gap:10px;padding:8px 0;align-items:flex-start}.step .d{width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;flex:none;font-weight:700}
.step.on .d{background:var(--ok);border-color:var(--ok);color:var(--on)}
.hero{background:linear-gradient(160deg,#0A3F66,#0A5C8C);color:#fff;border-radius:22px;padding:22px;margin-bottom:12px}
.hero .b{background:#fff;color:#0A3F66;border-color:#fff}.hero .b.s{background:transparent;color:#fff}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes p{0%{r:9;opacity:.7}100%{r:20;opacity:0}}.pulse{animation:p 2s infinite}
</style></head><body>
<div class="app" id="app"></div>
<div class="vh" id="lv" role="status" aria-live="polite"></div>
<script>
const P={ENT:{n:'Entrada Sul',f:'Térreo',x:25,y:100,b:'01',d:'Entrada principal com porta automática e piso tátil.',r:['Porta automática','Piso tátil'],i:'🚪'},
BAL:{n:'Balcão de Informações',f:'Térreo',x:85,y:100,b:'02',d:'Atendimento com balcão rebaixado. Aceita conversa por escrito.',r:['Balcão rebaixado','Atendimento por escrito','Piso tátil'],i:'ℹ️',c:'Serviços'},
BAN:{n:'Banheiro acessível',f:'Térreo',x:85,y:165,b:'03',d:'Cabine ampla com barras de apoio e porta de abertura leve.',r:['Barras de apoio','Espaço para giro de cadeira'],i:'🚻',c:'Serviços'},
EST:{n:'Estacionamento acessível',f:'Térreo',x:25,y:165,b:'04',d:'Vagas largas próximas à entrada, com piso nivelado.',r:['Vagas largas','Piso nivelado'],i:'🅿️',c:'Serviços'},
ESC:{n:'Escada',f:'Térreo',x:150,y:60,b:'05',d:'Escada fixa. Não faz parte de rotas sem escadas.',r:[],i:'🪜'},
ELV:{n:'Elevadores',f:'Térreo',x:150,y:140,b:'06',d:'Dois elevadores com botões em braille e aviso sonoro de andar.',r:['Braille','Aviso sonoro','Espelho interno'],i:'🛗',c:'Serviços'},
LOJ:{n:'Loja Aurora Moda',f:'Térreo',x:225,y:140,b:'07',d:'Loja fictícia com corredores largos e provadores amplos.',r:['Corredores largos','Provador acessível','Atendimento por escrito'],i:'🛍️',c:'Lojas'},
PA:{n:'Praça de Alimentação',f:'Piso 1',x:225,y:60,b:'08',d:'Mesas com espaço livre para cadeira de rodas e cardápio em letras grandes.',r:['Mesas adaptadas','Cardápio ampliado'],i:'🍽️',c:'Alimentação'},
ET:{n:'Espaço Tranquilo',f:'Piso 1',x:272,y:100,b:'09',d:'Sala com pouca luz e sem música, para pausar de ruídos e estímulos.',r:['Baixo estímulo','Sem música','Assentos'],i:'🌿',c:'Serviços'}};
const E=[['ENT','BAL'],['ENT','EST'],['BAL','BAN'],['BAL','ESC','s'],['BAL','ELV'],['ESC','PA'],['ELV','PA','q'],['ELV','LOJ'],['LOJ','PA'],['LOJ','ET'],['PA','ET']];
const D=Object.keys(P).filter(k=>k!='ESC');
const PR=[['audio','🔊','Orientações por áudio','Instruções faladas durante a navegação'],['text','💬','Comunicação por texto','Abre a Central já na conversa escrita'],['big','🔎','Texto ampliado','Letras maiores em todo o app'],['hc','◐','Alto contraste','Cores de máximo contraste'],['nost','♿','Rotas sem escadas','Evita degraus no planejamento'],['elv','🛗','Preferência por elevadores','Destaca elevadores nos trajetos'],['simp','✨','Navegação simplificada','Menos informações em cada tela'],['calm','🌿','Redução de estímulos','Sem animações e cores mais suaves']];
const S={sc:'welcome',st:[],tab:'home',p:{audio:false,text:false,big:false,hc:false,nost:true,elv:true,simp:false,calm:false,lang:'pt'},loc:'ENT',q:'',pl:null,mode:'acc',dst:'',org:'ENT',R:null,ni:0,bl:[],live:false,done:false,msgs:[],role:'v',msg:'',ct:'cards',cl:0,cat:'Informações',sit:'',ch:'Mensagem de texto',det:'',req:null,lib:false,full:false,note:'',draft:'',alert:'',hm:{ENT:2,BAL:6,BAN:3,EST:1,ESC:0,ELV:9,LOJ:4,PA:5,ET:1},barr:[{n:'Elevadores: botão em braille solto',ok:false},{n:'Rampa da praça: piso molhado',ok:true}],nr:37,emc:0,em:null};

const QK={'Informações':['Qual o horário de funcionamento?','Onde posso ver o mapa?'],'Localização':['Onde estou agora?','Pode me levar até a saída?'],'Atendimento':['Preciso de atendimento por escrito.','Pode repetir mais devagar?'],'Compras':['Esta loja tem provador acessível?','Qual o valor deste produto?'],'Alimentação':['Há opções sem glúten?','Pode ler o cardápio para mim?'],'Acessibilidade':['Preciso de uma rota sem escadas.','Preciso de um lugar tranquilo.']};
const ML=[['Olá, preciso de ajuda.','Hello, I need help.','Hola, necesito ayuda.'],['Onde fica o banheiro?','Where is the restroom?','¿Dónde está el baño?'],['Preciso de um elevador.','I need an elevator.','Necesito un ascensor.'],['Obrigado(a) pela ajuda.','Thank you for your help.','Gracias por su ayuda.'],['Pode escrever, por favor?','Could you write it down, please?','¿Puede escribirlo, por favor?'],['Onde fica a praça de alimentação?','Where is the food court?','¿Dónde está la zona de comida?']];
const SIT=['Não consigo encontrar meu destino','Encontrei uma barreira no caminho','Preciso de ajuda para me comunicar','Preciso de acompanhamento','Necessito de apoio de um funcionário'];
const LG={pt:'pt-BR',en:'en-US',es:'es-ES'},LI={pt:0,en:1,es:2};
const CTX={ENT:{t:'Entrada Sul',a:[{t:'Pedir um mapa tátil',m:'Gostaria de um mapa tátil, por favor.'}]},BAL:{t:'Balcão de Informações',a:[{t:'Atendimento por escrito',m:'Gostaria de atendimento por escrito.'},{t:'Pedir acompanhante',m:'Preciso de acompanhamento até meu destino.'}]},BAN:{t:'Banheiro acessível',a:[{t:'Pedir ajuda neste local',m:'Preciso de ajuda no banheiro acessível.'}]},EST:{t:'Estacionamento acessível',a:[{t:'Pedir ajuda com a vaga',m:'Preciso de ajuda perto do estacionamento.'}]},ESC:{t:'Escada (evite em rotas acessíveis)',a:[{t:'Preciso de um elevador',m:'Preciso de um elevador.'}]},ELV:{t:'Elevadores com braille e aviso sonoro',a:[{t:'Ajuda para usar o elevador',m:'Preciso de ajuda para usar o elevador.'}]},LOJ:{t:'Loja Aurora Moda',a:[{t:'Pedir provador acessível',m:'Gostaria de usar o provador acessível.'},{t:'Atendimento por escrito',m:'Gostaria de atendimento por escrito.'}]},PA:{t:'Praça de Alimentação',a:[{t:'Cardápio ampliado',m:'Gostaria do cardápio em letras grandes.'},{t:'Informar alergia',m:'Tenho alergia alimentar. Pode me ajudar a escolher?'},{t:'Pedir água',m:'Gostaria de água.'}]},ET:{t:'Espaço Tranquilo',a:[{t:'Ativar redução de estímulos',calm:1}]}};
function ctx(){const c=CTX[S.loc];return `<div class="cd" style="border-color:var(--pr)"><b>✨ Neste local: ${c.t}</b><p class="mu sm" style="margin:2px 0 6px">Sugestões do beacon BLE-${P[S.loc].b} (simulado)</p>${c.a.map((a,i)=>`<button class="tg" onclick="A('ctx',${i})"><b>${a.t}</b></button>`).join('')}</div>`}
function vib(){try{navigator.vibrate&&navigator.vibrate([250,100,250])}catch(e){}ann('Vibração enviada (se o aparelho permitir)')}
const $=s=>document.querySelector(s);
const dist=(u,v)=>Math.hypot(P[u].x-P[v].x,P[u].y-P[v].y);
const isB=(u,v)=>S.bl.includes(u+'-'+v)||S.bl.includes(v+'-'+u);
function path(a,b,m){const adj={};E.forEach(([u,v,f])=>{if(isB(u,v)||(f=='s'&&m!='short')||(m=='emg'&&(u=='ELV'||v=='ELV')&&P[u].f!=P[v].f))return;let d=dist(u,v);if(f=='q'&&m=='quiet')d*=3;(adj[u]=adj[u]||[]).push([v,d]);(adj[v]=adj[v]||[]).push([u,d])});
const dd={[a]:0},pr={},q=new Set(Object.keys(P));
while(q.size){let u=null;q.forEach(x=>{if(dd[x]!==undefined&&(u===null||dd[x]<dd[u]))u=x});if(u===null)break;q.delete(u);if(u==b)break;(adj[u]||[]).forEach(([v,d])=>{if(dd[v]===undefined||dd[u]+d<dd[v]){dd[v]=dd[u]+d;pr[v]=u}})}
if(dd[b]===undefined)return null;const r=[b];while(r[0]!=a)r.unshift(pr[r[0]]);return r}
const meters=R=>Math.round(R.slice(1).reduce((s,v,i)=>s+dist(R[i],v),0)/4);
function ins(i,R0){const R=R0||S.R,u=R[i],v=R[i+1];if(!v)return 'Você chegou a '+P[u].n+'.';const e=E.find(x=>(x[0]==u&&x[1]==v)||(x[0]==v&&x[1]==u));let t=`Siga ${Math.round(dist(u,v)/4)} metros até ${P[v].n}.`;
if(P[u].f!=P[v].f)t+=(u=='ELV'||v=='ELV')?` Suba pelo elevador até o ${P[v].f}.`:' Use a rampa de inclinação suave até o '+P[v].f+'.';
if(e[2]=='s')t+=' Atenção: trecho com degraus.';if(e[2]=='q')t+=' Trecho com mais movimento de pessoas.';return t}
function say(t,f){if(!(f||S.p.audio))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=LG[S.p.lang];speechSynthesis.speak(u)}catch(e){}}
function ann(t){$('#lv').textContent='';setTimeout(()=>$('#lv').textContent=t,50)}

const tp=(t,b)=>`<div class="top">${b?`<button class="bk" aria-label="Voltar" onclick="A('back')">←</button>`:''}<h1 style="margin:0;flex:1">${t}</h1></div>`;
function tog(k){const [,i,t,d]=PR.find(x=>x[0]==k);const on=S.p[k];return `<button class="tg" aria-pressed="${on}" onclick="A('pref','${k}')"><span style="font-size:1.5em" aria-hidden="true">${i}</span><span><b>${t}</b><br><span class="mu sm">${d}</span></span><span class="sw">${on?'Ativado ✓':'Desativado'}</span></button>`}

function map(R0,c0){let s=`<svg viewBox="0 0 300 200" role="img" aria-label="Mapa ilustrativo do shopping. Use a descrição em texto abaixo." style="width:100%;border-radius:14px;background:var(--sf);border:1.5px solid var(--bd)">`;
E.forEach(([u,v,f])=>{const a=P[u],b=P[v],bk=isB(u,v);s+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" style="stroke:${bk?'var(--wa)':f=='s'?'var(--wa)':'var(--bd)'}" stroke-width="6" stroke-linecap="round" ${f=='s'||bk?'stroke-dasharray="3 6"':''}/>`;
if(f=='s')s+=`<text x="${(a.x+b.x)/2+4}" y="${(a.y+b.y)/2}" font-size="8" style="fill:var(--wa)">degraus</text>`;if(bk)s+=`<text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2+4}" font-size="16" font-weight="700" style="fill:var(--wa)">✕</text>`});
const R=R0||S.R||[];if(R.length>1)s+=`<polyline points="${R.map(k=>P[k].x+','+P[k].y).join(' ')}" fill="none" style="stroke:var(--pr)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`;
Object.keys(P).forEach(k=>{const p=P[k],cur=c0?c0==k:S.live?R[S.ni]==k:S.loc==k;s+=`<circle class="pulse" cx="${p.x}" cy="${p.y}" r="9" style="fill:none;stroke:var(--pr)" stroke-width="2"/><circle cx="${p.x}" cy="${p.y}" r="${cur?9:6}" style="fill:${cur?'var(--pr)':'var(--cd)'};stroke:var(--pr)" stroke-width="2.5"/>${cur?`<text x="${p.x}" y="${p.y+3}" font-size="9" text-anchor="middle" style="fill:var(--on)">●</text>`:''}<text x="${p.x}" y="${p.y+(p.y>150?19:-13)}" font-size="8" font-weight="700" text-anchor="middle" style="fill:var(--tx)">${p.n.split(' ')[0]}</text>`});
return s+'</svg><p class="mu sm">Mapa ilustrativo com dados fictícios. Círculos pulsantes = beacons BLE simulados.</p>'}
function res(){const q=S.q.toLowerCase().trim();const l=D.filter(k=>(P[k].n+P[k].c+P[k].r.join()).toLowerCase().includes(q));
return l.length?l.map(k=>`<button class="tg" onclick="A('place','${k}')"><span style="font-size:1.6em" aria-hidden="true">${P[k].i}</span><span><b>${P[k].n}</b><br><span class="mu sm">${P[k].f} · ${P[k].c||'Local'}${P[k].r[0]?' · '+P[k].r[0]:''}</span></span></button>`).join(''):`<div class="cd"><b>Nada encontrado para “${h(S.q)}”.</b><p class="mu">Tente “banheiro”, “elevador” ou “tranquilo”.</p></div>`}
const H={
welcome(){return `<main tabindex="-1"><div class="hero"><div style="font-size:2.4em;font-weight:700">Acessa<span style="color:#7FD0FF">+</span></div><h1 style="font-size:1.35em">Acessibilidade que conecta pessoas.</h1><p>Comunique-se do seu jeito, encontre caminhos que fazem sentido para você e peça apoio quando quiser. Sem cadastro.</p></div>
<button class="b" onclick="A('go','prefs')">Começar</button><div style="height:10px"></div><button class="b s" onclick="A('go','prefs')">♿ Preferências de acessibilidade</button>

<p class="mu sm">Protótipo de demonstração: tudo aqui é simulado, com dados fictícios.</p></main>`},

home(){const hr=new Date().getHours(),g=hr<12?'Bom dia':hr<18?'Boa tarde':'Boa noite';
return `<main tabindex="-1"><div class="top"><div style="flex:1"><p class="mu" style="margin:0">${g}!</p><h1 style="margin:0">Como podemos ajudar hoje?</h1></div><button class="bk" aria-label="Perfil e configurações" onclick="A('go','profile')">👤</button></div>
<label class="vh" for="hq">Pesquisar lojas e serviços</label><input id="hq" type="search" placeholder="🔍 Buscar loja, banheiro, elevador…" onkeydown="if(event.key=='Enter'){S.q=this.value;A('tab','explore')}">

function A(a,v){switch(a){
case'go':S.st.push(S.sc);S.sc=v;S.alert='';break;
case'back':S.sc=S.st.pop()||'main';break;
case'tab':S.sc='main';S.tab=v;S.st=[];S.alert=S.alert&&S.alert[0]=='!'?'':S.alert;if(v=='comm'&&S.p.text&&!S.msgs.length&&S.ct=='cards')S.ct='chat';if(v=='nav'&&!S.live&&!S.done&&!S.dst)S.org=S.loc;break;
case'pref':S.p[v]=!S.p[v];if(v=='nost'&&S.p.nost)S.mode='acc';break;
case'lang':S.p.lang=v;break;
case'loc':S.loc=v;break;
case'place':S.pl=v;S.st.push(S.sc=='main'?'main':S.sc);S.sc='place';break;
case'howto':S.dst=v;S.org=S.loc;S.mode=S.p.nost?'acc':'short';S.live=false;S.done=false;S.sc='main';S.tab='nav';S.st=[];break;
case'mode':S.mode=v;break;
case'org':S.org=v;break;
case'dst':S.dst=v;break;
case'start':if(!S.R)break;S.nr++;S.live=true;S.ni=0;S.bl=[];S.alert='';S.loc=S.R[0];say(ins(0));ann(ins(0));break;
case'near':{const R=S.R,i=R.indexOf(v);S.loc=v;S.alert='';
if(v==S.dst){S.live=false;S.done=true;say('Você chegou ao destino.');break}
if(i>=0){S.ni=i;say(ins(i));ann(ins(i))}else{const r=path(v,S.dst,S.mode);if(r){S.R=r;S.ni=0;S.alert='Você saiu da rota. Recalculamos o trajeto a partir de '+P[v].n+'.';say(S.alert)}else S.alert='Não encontramos caminho a partir daqui. Use o botão de ajuda.'}break}
case'obs':{const R=S.R,u=R[S.ni],n=R[S.ni+1];if(!n)break;S.bl.push(u+'-'+n);S.barr.unshift({n:'Trecho '+P[u].n+' → '+P[n].n+' (reportado na navegação)',ok:false});const r=path(u,S.dst,S.mode);
if(r){S.R=r;S.ni=0;S.alert='🚧 Obstáculo simulado entre '+P[u].n+' e '+P[n].n+'. Rota alternativa cadastrada aplicada ('+meters(r)+' m).'}else S.alert='🚧 Obstáculo simulado e não há rota alternativa cadastrada. Peça ajuda.';say(S.alert);ann(S.alert);break}
case'card':S.msg=v;say(v);break;
case'role':S.role=v;break;
case'send':{const t=S.draft.trim();if(!t){S.note='Digite uma mensagem para enviar.';break}S.msgs.push({w:S.role,t});S.msg=t;S.draft='';S.note='';break}
case'quick':S.msgs.push({w:S.role,t:v});S.msg=v;S.ct='chat';break;
case'mic':{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){S.note='Seu navegador não oferece transcrição de voz. Digite sua mensagem no campo acima.';break}
const r=new SR();r.lang=LG[S.p.lang];r.onresult=e=>{S.draft=e.results[0][0].transcript;S.note='Transcrição pronta. Revise e envie.';render()};r.onerror=()=>{S.note='Não foi possível usar o microfone (permissão negada ou indisponível). Digite sua mensagem.';render()};try{r.start();S.note='Ouvindo… fale agora.'}catch(e){S.note='Microfone indisponível. Digite sua mensagem.'}break}
case'sub':if(!S.sit){S.alert='!Escolha a situação que melhor descreve o que está acontecendo.';break}S.alert='';S.hm[S.loc]++;S.req={t:S.sit,ch:S.ch,det:S.det,loc:P[S.loc].n+', '+P[S.loc].f,st:0,x:false};break;
case'adv':if(S.req.st<2)S.req.st++;ann(['Solicitação registrada','Atendimento iniciado','Atendimento concluído'][S.req.st]);break;
case'cancel':S.req.x=true;break;
case'fix':S.barr[v].ok=!S.barr[v].ok;break;
case'ctx':{const c=CTX[S.loc].a[v];if(c.calm){S.p.calm=true;ann('Redução de estímulos ativada');break}S.msg=c.m;say(c.m);S.sc='main';S.tab='comm';S.ct='cards';S.st=[];ann('Mensagem pronta na Central de Comunicação');break}
case'emerg':{S.emc++;const c=['ENT','EST'].map(x=>path(S.loc,x,'emg')).filter(Boolean).sort((a,b)=>meters(a)-meters(b))[0];S.em={R:c||null,i:0};S.st=[];S.sc='emerg';if(c){const t='Alerta de emergência simulado. '+ins(0,c);say(t,1);vib();ann(t)}break}
case'enext':{const e=S.em;if(e.i<e.R.length-1)e.i++;S.loc=e.R[e.i];const t=ins(e.i,e.R);say(t,1);vib();ann(t);break}}
render();const m=$('main');if(m&&['go','back','tab','place','howto','start'].includes(a)){m.focus();m.scrollTop=0}}
render();
</script></body></html>
